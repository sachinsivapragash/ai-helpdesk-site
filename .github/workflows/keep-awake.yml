# Keeps the free Render instance from sleeping by visiting the site every 10 minutes.
# It requests a static file, so it does not wake the database. GitHub may run scheduled
# jobs a few minutes late, and it pauses schedules after 60 days without repo activity.
name: Keep site awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the live site
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://ai-helpdesk-site.onrender.com/favicon.svg
