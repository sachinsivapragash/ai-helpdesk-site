<!doctype html>
<html lang="en">
<head>
{{> head}}
<meta name="robots" content="noindex">
<title>Admin – {{siteName}}</title>
</head>
<body>
{{> header}}
<main id="main">
  <section class="page-head">
    <div class="container page-head-inner">
      <span class="page-icon" aria-hidden="true">🗂️</span>
      <div>
        <p class="eyebrow">For organisers</p>
        <h1>Organiser dashboard</h1>
        <p class="lead">Manage support tickets and bookings. Requires the admin token.</p>
      </div>
    </div>
  </section>
  <div class="container section page-body">
  <h2>Support tickets</h2>
  <form id="admin-login" class="card form inline-form">
    <label>Admin token <input name="token" type="password" autocomplete="current-password"></label>
    <button class="btn" type="submit">Load tickets</button>
  </form>
  <p id="admin-stats" class="muted"></p>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>Ref</th><th>Created</th><th>Source</th><th>Subject / message</th><th>Contact</th><th>Status</th><th></th></tr></thead>
      <tbody id="ticket-rows"></tbody>
    </table>
  </div>
  <h2>Bookings</h2>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>Ref</th><th>Event</th><th>Name / email</th><th>Seats</th><th>Booked</th><th>Status</th><th></th></tr></thead>
      <tbody id="booking-rows"></tbody>
    </table>
  </div>
  </div>
</main>
{{> footer}}
<script src="/js/admin.js?v={{assetVersion}}"></script>
</body>
</html>
