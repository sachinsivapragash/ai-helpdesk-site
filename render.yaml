# Render Blueprint. Secrets marked sync:false are entered in the Render dashboard and never stored in Git.
services:
  - type: web
    name: ai-helpdesk-site-2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed && gunicorn eventease.wsgi --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SITE_NAME
        value: EventEase
      - key: CAMPUS_CITY
        value: Coimbatore
      - key: SITE_OWNER_NAME
        sync: false
      - key: SITE_OWNER_EMAIL
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
